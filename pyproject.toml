[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["joblib", "joblib.*", "sklearn", "sklearn.*", "pandas", "pandas.*", "uvicorn", "uvicorn.*"]
ignore_missing_imports = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-app"
dynamic = ["version"]
description = "Classifieur de sentiment d'avis clients en français"
readme = "README-PAQUET.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.30,<0.31",
    "pydantic>=2.9,<3",
    "scikit-learn==1.5.*",
    "joblib>=1.4,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
ui = ["streamlit>=1.39,<1.40", "pandas>=2.2,<3", "httpx>=0.27,<0.28"]

[project.scripts]
sentiment = "sentiment_app.cli:main"

[tool.setuptools]
packages = ["sentiment_app", "api", "ui"]

[tool.setuptools.dynamic]
version = {attr = "sentiment_app.__version__"}

[tool.setuptools.package-data]
sentiment_app = ["modele/*.joblib"]
